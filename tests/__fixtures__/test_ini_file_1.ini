# Kevlar site configuration
; author: Aadvik

[site]
title = Aadvik's Wicked Blog
base_url = https://aadvikpandey.com
description = A personal blog about systems programming, career, random
	musings, and (sometimes) fitness

[build]
output_dir = ./dist
posts_dir : ./posts
minify_html = true
ignore = README.md
	.gitignore
	LICENSE

# Author block
[author]
name : Aadvik
email = hi@example.com
bio = Self-taught engineer based in Bangalore.
	Interested in compilers and systems.
	Currently building Kevlar.

[author.social]
github = https://github.com/aadv1k
twitter : none

[theme]
name = default
posts_per_page = 10

[theme.default]
show_dates : true
accent : dark
footer_text = Built with Kevlar.
	Fast and simple.

[theme.default.colors]
background = #1a1a1a
foreground = #f0f0f0
accent = #ff6600

[theme.default.colors.dark]
background = #000000
foreground = #ffffff

; edge cases
[edge]
url = https://example.com/path/to/something?q=1&p=2
path = ./some/deeply/nested/../normalized/path
empty_ish = .
number = 42
float_ish = 3.14
colon_sep : value with = sign inside
eq_sep = value with : colon inside
